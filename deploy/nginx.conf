# Serves the built menu (dist/). TLS is handled by the Coolify proxy in front.
server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  error_page 404 /404.html;

  # App shell: always revalidate, so a new deploy is picked up right away.
  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Hashed build files: safe to cache for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Photos and logos keep their names when replaced: cache a day, refresh in the background.
  location /img/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
  }

  location = /404.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    internal;
  }

  # Never serve hidden files.
  location ~ /\. {
    return 404;
  }

  # Everything else (icons, 404.css): normal cache, unknown paths get the 404 page.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }
}
